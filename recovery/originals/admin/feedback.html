<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<!-- Feedback form -->
<html>
<head>
<title>Feedback Form</title>
</head>

<body>

<h1>Feedback Form</h1>

<p>Enter your name, e-mail and comments about our web-site, services and products.
Then click <i>Submit</i> to send your comments. To clear the form, click <i>Reset</i>.</p>

<!-- Form starts -->
<form name="Feedback_form" action="mailto:riachs@frontiernet.net" method="POST">
<table width="100%" border="0">
<tr>
  <td width="120">Name</td>
  <td><input name="Name" size="30"></td>
</tr>
<tr>
  <td width="120">E-mail</td>
  <td><input name="Email" size="30"></td>
</tr>
<tr>
  <td width="120" valign="top">Comments</td>
  <td><textarea name="Comments" rows="5" cols="40"></textarea></td>
</tr>
<tr>
  <td>
  </td>
  <td>
  <input type="submit" name="Submit" value="Submit">&nbsp;<input type="reset" name="Reset" value="Reset">
  </td>
</tr>
</table>
</form>
<!-- Form ends -->
<br>
</body>

</html>
